plugins {
    id 'com.android.application'
}

// Applied by plugin id (not the plugins{} DSL) because the plugin-marker
// artifacts are not reachable offline; kotlin-gradle-plugin comes from the
// root buildscript classpath.
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.oymotion.sensorcapiktdemo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.oymotion.sensorcapiktdemo'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a', 'x86'
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Prebuilt AAR bundled in this project (libsensor.so + libsensorcapi_jni.so
    // + the Java/Kotlin binding classes, all three ABIs). It was produced by
    // bld/android/build_android.py in the SensorSDKCXX repo; refresh
    // app/libs/sensorcapi-release.aar after changing the SDK sources.
    // A local AAR carries no transitive POM, so kotlin-stdlib is declared
    // explicitly below (it was `api` from the sensorcapi module before).
    implementation files('libs/sensorcapi-release.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
