// Top-level build file
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Resolved directly (not via the plugins{} DSL) because the
        // plugin-marker artifacts are not reachable offline on this machine;
        // kotlin-gradle-plugin itself is in the local Gradle cache.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
    }
}
plugins {
    id 'com.android.application' version '8.7.2' apply false
    id 'com.android.library' version '8.7.2' apply false
}
